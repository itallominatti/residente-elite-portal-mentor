name: Deploy

# Push na main (ou disparo manual) -> CI completo -> build -> S3 -> CloudFront.
# Credenciais: OIDC, sem chave guardada. O papel (iac/github-oidc.tf) só
# aceita jobs do environment "production" deste repositório e só grava no
# bucket do portal e invalida a distribuição dele.
#
# Configurar no GitHub (Settings -> Environments -> production -> Variables):
#   AWS_DEPLOY_ROLE_ARN         saída deploy_role_arn do terraform
#   S3_BUCKET                   saída s3_bucket
#   CLOUDFRONT_DISTRIBUTION_ID  saída cloudfront_distribution_id
#   VITE_API_BASE_URL           https://api.residente-elite.com/api/v1
#   VITE_FEATURE_METRICAS_DO_MENTOR  false (true depois do ajuste no back-end)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Um deploy por vez, e nunca cancelar um que já começou a gravar no bucket.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publicar em produção
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://mentor.residente-elite.com
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Conferir variáveis do environment
        run: |
          faltam=""
          for v in AWS_DEPLOY_ROLE_ARN S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID VITE_API_BASE_URL; do
            [ -n "${!v}" ] || faltam="$faltam $v"
          done
          if [ -n "$faltam" ]; then echo "::error::Variáveis faltando no environment production:$faltam"; exit 1; fi
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_FEATURE_METRICAS_DO_MENTOR: ${{ vars.VITE_FEATURE_METRICAS_DO_MENTOR || 'false' }}

      - name: Credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: portal-mentor-${{ github.run_id }}

      # Ordem pensada para não haver janela com página quebrada:
      # 1) arquivos com hash primeiro (imutáveis, cache de 1 ano);
      # 2) o resto (favicon etc.), cache curto;
      # 3) index.html por último, sem cache: só agora a versão nova "liga".
      # Os arquivos com hash do deploy anterior NÃO são apagados: uma aba
      # aberta com o index antigo ainda pede os pedaços (lazy) da versão dela,
      # e apagar quebraria a navegação dessa pessoa. São poucos KB por deploy.
      - name: Enviar para o S3
        run: |
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
            --cache-control "public,max-age=31536000,immutable" --only-show-errors
          aws s3 sync dist "s3://$S3_BUCKET" --exclude "assets/*" --exclude "index.html" \
            --cache-control "public,max-age=3600" --only-show-errors
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" --content-type "text/html; charset=utf-8"

      - name: Invalidar o CloudFront
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" \
            --paths "/index.html" "/" "/favicon.png" --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION_ID" --id "$id"

      - name: Conferir o site no ar
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://mentor.residente-elite.com/mentorandos)
          echo "GET /mentorandos -> $code"
          [ "$code" = "200" ]
